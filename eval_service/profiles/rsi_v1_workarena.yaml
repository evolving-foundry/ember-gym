# WorkArena-L1 task-class-disjoint RSI project split.
profile_id: rsi-v1-workarena

adapters:
  browsergym:
    harness_agent: browsergym_agent
    version: "browsergym-0.14.4-workarena"
    config_paths:
      - responses_api_agents/browsergym_agent/configs/browsergym_agent.yaml
      - responses_api_models/openai_model/configs/rsi_policy_endpoint.yaml
    manifest_env: [RSI_AGENT_BASE_URL, RSI_AGENT_MODEL]
    description: BrowserGym action loop using the activated RSI candidate policy endpoint.
  browsergym_dsh:
    harness_agent: browsergym_agent
    version: "browsergym-0.14.4-workarena-dsh-v1"
    config_paths:
      - responses_api_agents/browsergym_agent/configs/browsergym_dsh_agent.yaml
    source_paths:
      - responses_api_agents/dsh_agent/session_usage.py
    manifest_env: [RSI_DSH_COMMAND, RSI_DSH_HOME, RSI_DSH_WORKSPACE_ROOT, RSI_BROWSERGYM_MAX_STEPS]
    description: BrowserGym action loop calling the materialized RSI DSH candidate.

benchmarks:
  workarena_l1:
    dataset_fpath: benchmarks/workarena/data/rsi/workarena_l1_train.jsonl
    holdout_dataset_fpath: benchmarks/workarena/data/rsi/workarena_l1_holdout.jsonl
    dataset_version: workarena-l1-rsi-split-1
    config_paths:
      - benchmarks/workarena/config.yaml
    source_paths:
      - benchmarks/workarena
      - responses_api_agents/browsergym_agent
      - responses_api_models/openai_model
    manifest_env: [SNOW_INSTANCE_URL, SNOW_INSTANCE_POOL]
    task_id_field: task_id
    probe_split_size: 8

tiers:
  probe: {limit: 4, num_repeats: 1, concurrency: 1, allowed_splits: [train_probe]}
  screen: {limit: 16, num_repeats: 1, concurrency: 1, allowed_splits: [train_probe, train_full]}
  full: {limit: 64, num_repeats: 2, concurrency: 1, allowed_splits: [train_full]}

budgets:
  split_eval_soft_limit: 10
  lineage_max_evals: 200
  lineage_max_tokens: 2000000000
